#b2{background-color:transparent;background-image:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260802_075145_1b557479-775b-43af-8270-f45d79d97d5a.png&w=1920&q=85");-webkit-mask-size:100% 100%;mask-size:100% 100%}
#reveal svg{position:absolute;inset:0;width:100%;height:100%;opacity:.1}
header{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:var(--header-pt) var(--pad-x) var(--section-gap)}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.15em;font-size:var(--logo);transition:opacity .2s}
.logo:hover{opacity:.8}.logo sup{font-size:var(--logo-deg);vertical-align:baseline;position:relative;top:-.5em;margin-left:2px;letter-spacing:0}
nav{display:flex;align-items:center;gap:var(--gap-nav);font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:var(--nav)}
nav button{text-transform:uppercase;letter-spacing:.2em;transition:opacity .2s}nav button:hover{opacity:.5}
nav .div{color:#9ca3af}
.bag{position:relative;display:flex}.bag svg{width:var(--icon);height:var(--icon)}
.badge{position:absolute;top:-.55em;right:-.7em;background:#000;color:#fff;border-radius:50%;min-width:1.4em;height:1.4em;font-size:.6rem;letter-spacing:0;display:none;align-items:center;justify-content:center}
main{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:2rem;padding:var(--main-py) var(--pad-x)}
@media(min-width:1024px){main{flex-direction:row}#reveal{display:block}.mob{display:none!important}}
.left{display:flex;flex-direction:column;justify-content:center;gap:clamp(1rem,2.5vh,2rem);align-items:flex-start}
.br{width:var(--corner);height:var(--corner);display:block;fill:none;stroke:#000;stroke-width:1.5}
h1{font-family:'Orbitron',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1.05;font-size:var(--headline)}
h1 span{display:block}
.chk{display:inline-block;width:var(--checker-w);height:var(--checker-h);margin-left:.3em;transform:translateY(2px);vertical-align:middle}
.cta{display:inline-flex;align-items:center;gap:var(--btn-gap);border:1px solid #9ca3af;border-radius:6px;text-transform:uppercase;letter-spacing:.18em;font-size:var(--body);font-weight:500;padding:var(--btn-py) var(--btn-px);transition:background .25s,color .25s,border-color .25s}
.cta svg{width:1.2em;height:1.2em;transition:transform .25s}
.cta:hover{background:#000;color:#fff;border-color:#000}.cta:hover svg{transform:translate(2px,-2px)}
.feat{position:relative;align-self:flex-end;min-width:var(--feature-min);padding:var(--feature-pad);display:flex;align-items:center;gap:1rem}
.feat .br{position:absolute}
.feat .tl{top:0;left:0}.feat .tr{top:0;right:0}.feat .bl{bottom:0;left:0}.feat .brr{bottom:0;right:0}
.globe{width:var(--globe);height:var(--globe);fill:none;stroke:#000;stroke-width:1.2;flex:none}
.tag{font-weight:600;text-transform:uppercase;letter-spacing:.18em;font-size:var(--body);line-height:1.6}
.mob{position:relative;z-index:10;padding:0 var(--pad-x) var(--main-py)}
.mob div{aspect-ratio:4/5;border:1px solid #e5e7eb;background:#f3f4f6 center/cover no-repeat}
@media(min-width:640px){.mob div{aspect-ratio:16/9}}
.back{position:fixed;inset:0;background:rgba(0,0,0,.2);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.back.on{opacity:1;pointer-events:auto}
